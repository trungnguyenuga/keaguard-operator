# This rule is not used by the project keaguard itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the infrastructure.keaguard.example.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: keaguard
    app.kubernetes.io/managed-by: kustomize
  name: keacluster-editor-role
rules:
- apiGroups:
  - infrastructure.keaguard.example
  resources:
  - keaclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infrastructure.keaguard.example
  resources:
  - keaclusters/status
  verbs:
  - get
