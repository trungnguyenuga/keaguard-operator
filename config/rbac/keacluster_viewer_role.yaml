# This rule is not used by the project keaguard itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to infrastructure.keaguard.example resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: keaguard
    app.kubernetes.io/managed-by: kustomize
  name: keacluster-viewer-role
rules:
- apiGroups:
  - infrastructure.keaguard.example
  resources:
  - keaclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - infrastructure.keaguard.example
  resources:
  - keaclusters/status
  verbs:
  - get
