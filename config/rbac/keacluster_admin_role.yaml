# This rule is not used by the project keaguard itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over infrastructure.keaguard.example.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: keaguard
    app.kubernetes.io/managed-by: kustomize
  name: keacluster-admin-role
rules:
- apiGroups:
  - infrastructure.keaguard.example
  resources:
  - keaclusters
  verbs:
  - '*'
- apiGroups:
  - infrastructure.keaguard.example
  resources:
  - keaclusters/status
  verbs:
  - get
