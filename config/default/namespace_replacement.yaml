# Reuse at the outermost namespace-changing overlay as well as in the base.
source:
  group: apps
  version: v1
  kind: Deployment
  name: controller-manager
  fieldPath: metadata.namespace
targets:
- select:
    group: apps
    version: v1
    kind: Deployment
    name: controller-manager
  fieldPaths:
  - spec.template.spec.containers.[name=manager].args.0
  options:
    delimiter: '='
    index: 1
